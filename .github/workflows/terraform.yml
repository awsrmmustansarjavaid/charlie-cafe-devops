name: Terraform Phase 2
on:
  workflow_dispatch:
    inputs:
      confirm_apply:
        description: "Set true only after reviewing the Phase 2 plan and confirming target AWS account"
        required: true
        type: boolean
        default: false
permissions:
  contents: read
  id-token: write
jobs:
  terraform:
    runs-on: ubuntu-latest
    env:
      TF_VAR_db_password: ${{ secrets.TF_VAR_DB_PASSWORD }}
    defaults:
      run:
        working-directory: terraform/environments/dev
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.11.4
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.TERRAFORM_AWS_ROLE_ARN }}
          aws-region: us-east-1
      - name: Package Lambda PyMySQL layer
        run: bash ../../scripts/package-lambda-layer.sh
      - name: Terraform Init
        run: terraform init -backend-config=backend.hcl
      - name: Terraform Format
        run: terraform fmt -check -recursive ../../..
      - name: Terraform Validate
        run: terraform validate
      - name: Terraform Plan
        run: terraform plan -out=phase2.tfplan
      - name: Apply (manual approval input only)
        if: inputs.confirm_apply == true
        run: terraform apply -auto-approve phase2.tfplan
